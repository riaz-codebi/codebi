<div class="table-pagination"><span>{{ data.total }} result{{ '' if data.total == 1 else 's' }} &middot; Page {{ page }}</span><div>{% if page > 1 %}<a href="{{ url_for(request.endpoint, client_id=client_id if client_id is defined else none, q=query, type=user_type if user_type is defined else none, page=page-1) }}">&larr; Previous</a>{% endif %}{% if page*25 < data.total %}<a href="{{ url_for(request.endpoint, client_id=client_id if client_id is defined else none, q=query, type=user_type if user_type is defined else none, page=page+1) }}">Next &rarr;</a>{% endif %}</div></div>
